spring:
  application:
    name: voiceandtext

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

resttemplate:
  connect-timeout: 5000
  read-timeout: 10000

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}

ai:
  server:
    url: ${AI_SERVER_URL}
    timeout: 10000

app:
  audio:
    max-file-size: 10485760 # 10MB
    max-duration-seconds: 60
    allowed-mime-types: audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave,audio/vnd.wave,audio/ogg,audio/webm,audio/mp4,video/mp4,audio/x-m4a,audio/aac,audio/x-aac,audio/flac,audio/x-flac
  guest:
    expiry-hours: 24
  cleanup:
    interval: 3600000 # 1시간 (밀리초)
